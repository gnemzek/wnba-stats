<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WNBA Game Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="tracker-container">
        <header>
            <h1 id="current-date"></h1>
        </header>

        <nav class="date-tabs">
            <button class="tab-btn" id="btn-yesterday">Yesterday</button>
            <button class="tab-btn active" id="btn-today">Today</button>
            <button class="tab-btn" id="btn-tomorrow">Tomorrow</button>
        </nav>

        <div id="status-banner" class="loading">Checking the schedule...</div>

        <main id="games-list" class="hidden"></main>
    </div>

    <script src="app.js"></script>
</body>

</html>
